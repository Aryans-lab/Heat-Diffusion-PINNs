[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idealpinn"
version = "1.0.0"
description = "What does an inverse physics-informed neural network estimate? Exact theory and precision tests for the heat equation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aryan Bandyopadhyay" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["idealpinn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer-running numerical checks"]
